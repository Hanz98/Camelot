name: Build
on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Basic Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential python3 python3-pip
          sudo python3 -m pip install conan pre-commit --ignore-installed urllib3

      - name: Install Conan Dependencies
        run: |
          sudo -E conan profile detect
          sudo -E conan install . --output-folder=build -c tools.system.package_manager:mode=install --build=missing -s build_type=Release

      - name: Install Vulkan Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libxcb1-dev

      - name: Set VULKAN_SDK automatically
        run: |
          if [ -f /usr/include/vulkan/vulkan.h ]; then
            echo "VULKAN_SDK=/usr" >> $GITHUB_ENV
          else
            echo "Vulkan header not found!" && exit 1
          fi

      - name: Install Vulkan Memory Allocator
        run: |
          git clone https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git /tmp/VulkanMemoryAllocator
          sudo mkdir -p /usr/local/include/vma
          sudo cp /tmp/VulkanMemoryAllocator/include/vk_mem_alloc.h /usr/local/include/vma/    
      - name: Build Project
        run: |
          if [ ! -f "build/generators/conan_toolchain.cmake" ]; then
            echo "Conan toolchain file not found!"
            exit 1
          fi
          sudo cmake \
            -S .  \
            -B build  \
            -G "Unix Makefiles" \
            -D CMAKE_TOOLCHAIN_FILE=build/generators/conan_toolchain.cmake \
            -D CMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -D CMAKE_BUILD_TYPE=Release \
            -D VULKAN_SDK=/usr
          sudo cmake --build build

      - name: Run Tests
        run: |
          cd build
          sudo ./bin/test_main

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Cache Vulkan SDK
        uses: actions/cache@v3
        id: cache-vulkan
        with:
          path: C:\VulkanSDK\1.3.280.0
          key: ${{ runner.os }}-vulkan-sdk-1.3.280.0

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Downloading Vulkan SDK..."
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.3.280.0/windows/VulkanSDK-1.3.280.0-Installer.exe" -OutFile "VulkanSDK-Installer.exe"
          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath "VulkanSDK-Installer.exe" -ArgumentList "/S" -Wait
          Remove-Item "VulkanSDK-Installer.exe"
          Write-Host "Vulkan SDK installation completed"

      - name: Set Vulkan Environment Variables
        run: |
          echo "VULKAN_SDK=C:\VulkanSDK\1.3.280.0" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\1.3.280.0\Bin" >> $env:GITHUB_PATH

      - name: Install Python and Conan
        run: |
          Write-Host "Installing Python and Conan..."
          choco install python3 -y
          python -m pip install --upgrade pip
          pip install conan
          Write-Host "Python and Conan installation completed"

      - name: Cache Conan Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.txt') }}

      - name: Setup Conan Profile
        run: |
          Write-Host "Setting up Conan profile..."
          conan profile detect --force
          Write-Host "Conan profile setup completed"

      - name: Install Conan Dependencies
        run: |
          Write-Host "Installing Conan dependencies..."
          conan install . --output-folder=build --build=missing -s build_type=Release
          Write-Host "Conan dependencies installation completed"

      - name: Install Vulkan Memory Allocator
        run: |
          Write-Host "Installing Vulkan Memory Allocator..."
          git clone https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git VulkanMemoryAllocator
          New-Item -ItemType Directory -Force -Path "C:\VulkanSDK\1.3.280.0\Include\vma"
          Copy-Item "VulkanMemoryAllocator\include\vk_mem_alloc.h" "C:\VulkanSDK\1.3.280.0\Include\vma\"
          Write-Host "VMA installation completed"

      - name: Build Project
        run: |
          Write-Host "Verifying CMake toolchain file..."
          if (!(Test-Path "build/generators/conan_toolchain.cmake")) {
            Write-Error "Conan toolchain file not found!"
            exit 1
          }
          Write-Host "Configuring CMake..."
          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -D CMAKE_TOOLCHAIN_FILE=build/generators/conan_toolchain.cmake `
            -D CMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -D CMAKE_BUILD_TYPE=Release `
            -D VULKAN_SDK="C:\VulkanSDK\1.3.280.0"
          Write-Host "Building project..."
          cmake --build build --config Release
          Write-Host "Build completed successfully"

      - name: Run Tests
        run: |
          Write-Host "Running tests..."
          cd build
          .\bin\Release\test_main.exe
          Write-Host "Tests completed successfully"
