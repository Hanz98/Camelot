name: Pre-commit Checks

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit and the hooks
        # pip wheels that ship a binary (clang-format) have come back from the
        # cache without their executable bit, which made the hook fail with
        # "Permission denied"; restoring the bit is cheap and idempotent.
        run: |
          pip install pre-commit
          pre-commit install-hooks
          find ~/.cache/pre-commit -path '*/site-packages/clang_format/data/bin/*' \
            -type f -exec chmod u+x {} +

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
