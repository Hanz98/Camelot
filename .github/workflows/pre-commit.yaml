name: Pre-commit Checks

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit and the hooks
        # The hook environments are deliberately not cached: a restored cache
        # repeatedly came back with the clang-format wheel's binary lacking its
        # executable bit ("Permission denied"). A fresh install costs about a
        # minute and is reproducible.
        run: |
          pip install pre-commit
          pre-commit install-hooks

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
